user:
  name: "Nathan"
  age_years: 26
  height_in: 67   # 5'7"
  weight_lb_range: [173, 177]   # planning range; latest numeric log was 2026-07-31
  goal_weight_lb: 151
  timezone: "America/Los_Angeles"  # use as source of truth for day/date checks

goals:
  primary: "cut"      # options: cut | recomp | maintenance | lean_bulk
  secondary: ["muscle_retention_or_regain", "strength", "calisthenics_skills", "running_stamina", "mobility_flexibility"]
  notes: "Cut gradually toward ~151 lb while building/retaining muscle and strength, developing a strong calisthenics foundation for advanced skills later, improving running stamina, and maintaining or improving mobility/flexibility."

training:
  days_per_week_target: 6     # full plan: 2 hybrid strength + 1 pure calisthenics + 3 Just Run; ramp from 4-5 while restarting if needed
  session_minutes_target: 60
  running_days_per_week: 3    # Just Run: Zero to 5K
  mobility_days_per_week: 6
  preferred_time: "morning"
  sleep_status: null          # update from current check-ins; do not carry stale sleep status forward

equipment:
  gym_access: true
  pullup_bar: true
  rings: true
  resistance_bands: true
  weighted_vest: true
  dumbbells: false            # no home dumbbells required; gym loading is optional/convenient
  yoga_blocks: true
  yoga_mat: true
  foam_roller: true
  notes: "Hybrid plan uses gym loading when convenient, but every gym-dependent movement has a home/calisthenics fallback using the pull-up bar, rings, bands, vest/backpack, sliders/bodyweight, and outdoor running."

constraints:
  injuries_or_pain: "Recurring low-left-back/lat discomfort or tension was logged during/after training on 2026-08-02, 2026-08-13, 2026-08-27, and 2026-09-22. Current symptom status is unknown; no diagnosis is recorded."
  schedule_notes: "Full plan alternates 3 resistance/skill days with 3 Just Run sessions and keeps 1 full rest day. Day 5 is protected as pure calisthenics. If gym access/timing is inconvenient, use the listed home fallback instead of skipping or doubling up. During the restart phase, 4-5 completed sessions is acceptable. Reduce volume 20-30% after poor sleep or unusual soreness."

nutrition:
  tracking_style: "track calories + macros"
  calorie_target_kcal: 1900
  calorie_flexible_range_kcal: [1800, 2000]
  protein_target_g_range: [160, 180]
  preferred_structure: "Typically skips breakfast; Huel Black with Kirkland 2% ultra-filtered milk when convenient, alongside meals; no fixed shake count"
  coaching_mode: "log in chat after each meal/workout; ask for daily plan each morning"
  meal_prep_availability: "No meal-prepped meals currently available as of 2026-10-08; do not suggest prior meal-prep dishes unless the user reports making a new batch."
